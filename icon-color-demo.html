<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Color Demo</title>
    <link rel="stylesheet" href="cssThemes/module/icon.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }
        .demo-section {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h2 { margin-top: 0; }
        .icon { font-size: 32px; margin: 0 12px; }

        /* 通过 color 改变图标颜色 */
        .red { color: #e74c3c; }
        .blue { color: #3498db; }
        .green { color: #2ecc71; }
        .orange { color: #f39c12; }
        .purple { color: #9b59b6; }

        /* hover 变色效果 */
        .hover-effect {
            color: #666;
            cursor: pointer;
            transition: color 0.3s;
        }
        .hover-effect:hover { color: #e74c3c; }
    </style>
</head>
<body>

    <div class="demo-section">
        <h2>🎨 不同颜色的图标（通过 color 属性控制）</h2>
        <p>
            <i class="icon icon-add red"></i>
            <i class="icon icon-edit blue"></i>
            <i class="icon icon-delete green"></i>
            <i class="icon icon-favorite orange"></i>
            <i class="icon icon-home purple"></i>
        </p>
    </div>

    <div class="demo-section">
        <h2>🖱️ Hover 变色效果</h2>
        <p>
            <i class="icon icon-browse hover-effect"></i>
            <i class="icon icon-good hover-effect"></i>
            <i class="icon icon-error hover-effect"></i>
            <i class="icon icon-complete hover-effect"></i>
        </p>
        <p style="color:#999;font-size:14px;">把鼠标移到图标上试试看</p>
    </div>

    <div class="demo-section">
        <h2>📐 继承父元素颜色</h2>
        <p style="color: #e74c3c;">
            <i class="icon icon-file"></i> 这段文字是红色，图标自动继承
        </p>
        <p style="color: #3498db;">
            <i class="icon icon-folder-close"></i> 这段文字是蓝色，图标自动继承
        </p>
    </div>

</body>
</html>
