<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRAM 3.0</title>
    <style>
        /* 全局样式重置与基础设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f0f2f5;
            overflow: hidden;
        }

        /* 顶部标题栏 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #e5e7eb;
            z-index: 100;
        }

        .header-left {
            font-weight: 600;
            font-size: 18px;
            color: #333;
        }

        .header-middle {
            background-color: #fff9e6;
            border: 1px solid #ffd580;
            border-radius: 20px;
            padding: 6px 16px;
            color: #d97706;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-icon {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #333;
        }

        .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 12px;
        }

        /* 侧边栏容器 */
        .sidebar {
            width: 240px;
            height: 100vh;
            background-color: #fff;
            border-right: 1px solid #e5e7eb;
            padding-top: 70px;
            /* 避开顶部标题栏 */
            overflow-y: auto;
            transition: width 0.3s ease;
        }

        /* 搜索框 */
        .search-box {
            padding: 0 16px 16px;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .search-input::placeholder {
            color: #9ca3af;
        }

        /* 菜单样式 */
        .menu-item {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-group {
            margin-bottom: 8px;
        }

        .menu-group-title {
            padding: 10px 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 菜单配色（严格匹配设计图） */
        .menu-group-title.product {
            color: #2563eb;
            /* Product 蓝色 */
        }

        .menu-group-title.sales {
            color: #059669;
            /* Sales 青绿色 */
        }

        .menu-group-title.purchasing {
            color: #1f2937;
            /* Purchasing 深灰色 */
        }

        .menu-group-title.schedule {
            color: #1f2937;
            /* Schedule 深灰色 */
        }

        .menu-group-title.production {
            color: #9333ea;
            /* Production 紫色 */
        }

        .menu-group-title.inventory {
            color: #059669;
            /* Inventory 青绿色 */
        }

        .sub-menu {
            padding-left: 24px;
            color: #4b5563;
        }

        .sub-menu-item {
            padding: 6px 0;
            cursor: pointer;
            font-size: 13px;
        }

        /* 折叠/展开图标 */
        .toggle-icon {
            font-size: 12px;
            transition: transform 0.2s ease;
        }

        .toggle-icon.collapsed {
            transform: rotate(-90deg);
        }

        /* 底部PRAM 3.0标识 */
        .pram-footer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: #3b82f6;
            color: #fff;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
        }

        /* 主内容区域 */
        .main-content {
            flex: 1;
            margin-top: 60px;
            padding: 20px;
            display: flex;
            gap: 20px;
            overflow-x: auto;
        }

        .content-card {
            flex: 1;
            min-width: 300px;
            height: calc(100vh - 100px);
            background-color: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
        }

        /* 放到你的 style 里 */
        .sidebar-top-buttons {
            display: flex;
            padding: 0 16px 12px;
            gap: 8px;
        }

        .sidebar-top-btn {
            flex: 1;
            height: 32px;
            border: 1px solid #e5e7eb;
            background: #fff;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        /* 卡片标题栏 + 最小化按钮 */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #e5e7eb;
            font-weight: 500;
            font-size: 14px;
        }

        .card-title {
            color: #333;
        }

        .card-minimize {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            color: #666;
        }

        .card-minimize:hover {
            color: #000;
        }
    </style>
</head>

<body>
    <!-- 顶部标题栏 -->
    <div class="header">
        <div class="header-left">THE DAILY CRUMB</div>
        <div class="header-middle">
            <span>🎃</span>
            Halloween Fun Place
            <span>🎃</span>
        </div>
        <div class="header-right">
            <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHZpZXdCb3g9IjAgMCAyMCAyMCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48Y2lyY2xlIGN4PSIxMCIgY3k9IjEwIiByPSIxMCIgZmlsbD0iIzY2NiI+PC9jaXJjbGU+PC9zdmc+"
                class="header-icon" alt="star" />
            <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHZpZXdCb3g9IjAgMCAyMCAyMCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTUiIGhlaWdodD0iMTUiIHg9IjIuNSIgeT0iMi41IiByeD0iMS41IiBmaWxsPSIjNjY2Ij48L3JlY3Q+PC9zdmc+"
                class="header-icon" alt="layout" />
            <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHZpZXdCb3g9IjAgMCAyMCAyMCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48Y2lyY2xlIGN4PSIxMCIgY3k9IjEwIiByPSIxMCIgZmlsbD0iIzY2NiIgc3Ryb2tlPSIjNjY2IiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCI+PC9jaXJjbGU+PC9zdmc+"
                class="header-icon" alt="refresh" />
            <div class="user-info">
                <span>Gloria</span>
                <div class="avatar">😀</div>
            </div>
        </div>
    </div>

    <!-- 侧边栏 -->
    <div class="sidebar">
        <!-- 左侧顶部图标按钮栏 -->
        <div class="sidebar-top-buttons">
            <button class="sidebar-top-btn">⭐</button>
            <button class="sidebar-top-btn">🕒</button>
            <button class="sidebar-top-btn">➕</button>
        </div>

        <!-- 搜索框 -->
        <div class="search-box">
            <input type="text" class="search-input" placeholder="Search Activities">
        </div>

        <!-- Product 菜单组（默认展开） -->
        <div class="menu-group">
            <div class="menu-group-title product" onclick="toggleMenu('product-menu')">
                <span class="toggle-icon">-</span>
                Product
            </div>
            <div id="product-menu" class="sub-menu">
                <div class="sub-menu-item">Part</div>
                <div class="sub-menu-item">BOM</div>
                <div class="sub-menu-item">Recipe</div>
                <div class="sub-menu-item">Where Used</div>
                <div class="sub-menu-item">Miss part</div>
                <div class="sub-menu-item">Replace/Add/Remove</div>
            </div>
        </div>

        <!-- Sales 菜单组（默认折叠） -->
        <div class="menu-group">
            <div class="menu-group-title sales" onclick="toggleMenu('sales-menu')">
                <span class="toggle-icon collapsed">+</span>
                Sales
            </div>
            <div id="sales-menu" class="sub-menu" style="display: none;"></div>
        </div>

        <!-- Purchasing 菜单组（默认折叠） -->
        <div class="menu-group">
            <div class="menu-group-title purchasing" onclick="toggleMenu('purchasing-menu')">
                <span class="toggle-icon collapsed">+</span>
                Purchasing
            </div>
            <div id="purchasing-menu" class="sub-menu" style="display: none;"></div>
        </div>

        <!-- Schedule 菜单组（默认折叠） -->
        <div class="menu-group">
            <div class="menu-group-title schedule" onclick="toggleMenu('schedule-menu')">
                <span class="toggle-icon collapsed">+</span>
                Schedule
            </div>
            <div id="schedule-menu" class="sub-menu" style="display: none;"></div>
        </div>

        <!-- Production 菜单组（默认折叠） -->
        <div class="menu-group">
            <div class="menu-group-title production" onclick="toggleMenu('production-menu')">
                <span class="toggle-icon collapsed">+</span>
                Production
            </div>
            <div id="production-menu" class="sub-menu" style="display: none;"></div>
        </div>

        <!-- Inventory 菜单组（默认折叠） -->
        <div class="menu-group">
            <div class="menu-group-title inventory" onclick="toggleMenu('inventory-menu')">
                <span class="toggle-icon collapsed">+</span>
                Inventory
            </div>
            <div id="inventory-menu" class="sub-menu" style="display: none;"></div>
        </div>

        <!-- 底部PRAM 3.0标识 -->
        <div class="pram-footer">PRAM 3.0</div>
    </div>

    <!-- 主内容区域 -->
    <div class="main-content">
        <div class="content-card">
            <div class="card-header">
                <div class="card-title">Card Title 1</div>
                <button class="card-minimize">−</button>
            </div>
        </div>
        <div class="content-card">
            <div class="card-header">
                <div class="card-title">Card Title 2</div>
                <button class="card-minimize">−</button>
            </div>
        </div>
        <div class="content-card">
            <div class="card-header">
                <div class="card-title">Card Title 3</div>
                <button class="card-minimize">−</button>
            </div>
        </div>
    </div>

    <script>
        // 菜单折叠/展开交互
        function toggleMenu(menuId) {
            const menu = document.getElementById(menuId);
            const icon = menu.previousElementSibling.querySelector('.toggle-icon');

            if (menu.style.display === 'none') {
                menu.style.display = 'block';
                icon.textContent = '-';
                icon.classList.remove('collapsed');
            } else {
                menu.style.display = 'none';
                icon.textContent = '+';
                icon.classList.add('collapsed');
            }
        }
    </script>
</body>

</html>
